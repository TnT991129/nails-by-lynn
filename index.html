<html lang="es">

    <meta name="description" content="Estudio de uñas en Peñas Altas. Reserva tu cita en menos de un minuto: elige servicio, día y hora." />
    <meta name="theme-color" content="#EE4397" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nails by Lynn — Reserva tu cita" />
    <meta property="og:description" content="Elige tu servicio, tu día y tu hora. Sin esperar respuesta." />
    <!-- WhatsApp e Instagram necesitan la URL completa de la imagen -->
    <meta property="og:site_name" content="Nails by Lynn" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://tnt991129.github.io/nails-by-lynn/" />
    <meta property="og:image" content="https://tnt991129.github.io/nails-by-lynn/og-image.jpg" />
    <meta property="og:image:width" content="1200" />

    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <!-- Instalable como app (el panel cambia título, icono y manifiesto al entrar) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nails by Lynn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Diseño de Lynn y tema claro/oscuro antes de pintar (sin destellos). Ver src/lib/diseno.ts y tema.ts -->
    <script>
      try {
        var r = document.documentElement
        var css = localStorage.getItem('nbl.diseno.css')
        if (css) { var e = document.createElement('style'); e.id = 'nbl-diseno'; e.textContent = css; document.head.appendChild(e) }
        var a = JSON.parse(localStorage.getItem('nbl.diseno.attrs') || '{}')
        if (a.fondo) r.dataset.fondo = a.fondo
        if (a.animaciones) r.dataset.animaciones = a.animaciones
        if (a.tema) r.dataset.temaDiseno = a.tema
        var t = localStorage.getItem('nbl.tema')
        if (t === 'oscuro' || (!t && (a.tema === 'oscuro'
            || (a.tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches))))
          r.classList.add('oscuro')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
